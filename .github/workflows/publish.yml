name: Publish

# Two ways to release. Both end with the package on npm.
#
#   push to main   The version is derived from the commits since the last `v*` tag by
#                  scripts/next-version.mjs: feat:/fix:/perf: → patch, `type!:` or a
#                  BREAKING CHANGE footer → major (minor while 0.x), and a `Release-As:`
#                  footer overrides. Commits that change nothing publish nothing. The
#                  release commit and its tag are pushed back to main.
#   push v1.2.3    Publishes exactly the tagged version from the tagged commit. Nothing
#                  is committed back; the automatic path builds on the newest tag.
#
# Run it by hand (workflow_dispatch) for a dry run: it works out the version and packs the
# tarball, and publishes nothing.
#
# Needs an NPM_TOKEN repository secret with publish rights on the @osqd scope.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Work out the version and pack it, publish nothing"
        type: boolean
        default: true

# One release at a time: two pushes landing together would race for the same version.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing reaches the registry that has not just passed everything, on this commit.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # First, deliberately: every later step regenerates the client bundle, so one of them
      # would quietly repair a stale commit instead of failing on it — and the release would
      # carry a page nobody committed.
      - name: The committed client bundle is current
        run: npm run client:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      # The docs travel in the tarball, so a link that resolves nowhere ships with it.
      - name: Every local link and anchor in the markdown resolves
        run: npm run docs:check
      # The page is shipped code, and how it behaves under a keyboard, a narrow viewport and
      # three engines cannot be checked by calling a function. It costs a browser download; a
      # release is exactly the moment that is worth paying for.
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test the page in a browser
        run: |
          npm run test:browser
          BROWSER_ENGINE=firefox npm run test:browser
          BROWSER_ENGINE=webkit npm run test:browser
      - name: The write path is within budget
        run: npm run bench:guard
      - name: The packed tarball installs and loads
        run: npm run check:package
      - name: This library depends on nothing
        run: |
          count=$(node -p "Object.keys(require('./package.json').dependencies ?? {}).length")
          test "$count" -eq 0
      # No runtime dependencies, so nothing at any level should reach a consumer.
      - name: No advisory reaches a consumer
        run: npm audit --omit=dev --audit-level=low

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # The automatic path commits the version and its tag back to main.
      contents: write
      # Provenance: npm records which workflow built this tarball from which commit.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.published.outputs.published }}
    steps:
      # Full history: the automatic version is derived from the commits since the last tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $GITHUB_REF_NAME is not v followed by a semver version"
              exit 1
            fi
            echo "Releasing $version from tag $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
            { echo "mode=tag"; echo "release=yes"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          else
            next=$(node scripts/next-version.mjs --explain)
            if [ -z "$next" ]; then
              echo "No commit since the last release changes what the package does. Nothing is published." >> "$GITHUB_STEP_SUMMARY"
              { echo "mode=auto"; echo "release=no"; } >> "$GITHUB_OUTPUT"
            else
              { echo "mode=auto"; echo "release=yes"; echo "version=$next"; } >> "$GITHUB_OUTPUT"
            fi
          fi

      # A published version is immutable; this also makes a re-run safe.
      - name: That version is not already published
        if: steps.version.outputs.release == 'yes'
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::$name@${{ steps.version.outputs.version }} is already on the registry"
            exit 1
          fi

      # Set here and not committed yet: that waits until the package is on the registry.
      - name: Set the version
        if: steps.version.outputs.release == 'yes'
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build
        if: steps.version.outputs.release == 'yes'
        run: npm run build

      # `files` is an allowlist, and the easiest thing in a package to get wrong expensively.
      - name: Inspect the tarball
        if: steps.version.outputs.release == 'yes'
        run: |
          npm pack --silent
          tarball=$(ls osqd-admin-panel-builder-*.tgz)
          size=$(stat -c%s "$tarball")
          echo "$tarball: $size bytes"
          # ESM split and CJS without maps put it near 1.3 MB; past 2 MB something is bundled twice again.
          test "$size" -lt 2000000
          for required in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts package/dist/cli.js package/dist/adapters/index.js package/dist/element.js package/dist/presets/index.js package/dist/sdk.js package/dist/testing.js package/dist/config/index.js package/admin-panel.toml package/bin/apb.mjs package/docs/index.md package/README.md package/LICENSE; do
            tar -tzf "$tarball" | grep -qx "$required" || { echo "::error::$required is missing from the tarball"; exit 1; }
          done
          if tar -tzf "$tarball" | grep -E '\.env$|/\.git/|node_modules/|\.tsbuildinfo$|\.test\.'; then
            echo "::error::the tarball contains something it should not"
            exit 1
          fi
          rm -f "$tarball"

      - name: Publish (dry run)
        if: steps.version.outputs.release == 'yes' && github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm publish --provenance --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        id: published
        if: steps.version.outputs.release == 'yes' && (github.event_name != 'workflow_dispatch' || !inputs.dry-run)
        run: |
          version="${{ steps.version.outputs.version }}"
          # A prerelease goes to `next`, so a plain install keeps resolving the last stable version.
          dist_tag=latest
          case "$version" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag"
          echo "published=yes" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Automatic releases only. The branch goes first and the tag only once it has landed,
      # so the tag can only name a commit that is on main. A push that arrived meanwhile is
      # handled by replaying the release commit on top of it. A push made with GITHUB_TOKEN
      # starts no workflow, so this tag does not trigger a second, tag-based release.
      - name: Commit, tag and push the release
        if: steps.published.outputs.published == 'yes' && steps.version.outputs.mode == 'auto'
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/version.ts
          # The first release of a version package.json already carries — the one this repository
          # starts at — changes no file, and `git commit` with nothing staged exits non-zero. There
          # is still a tag to make: it is what the next version is derived from, and 0.1.0 was
          # published and left untagged exactly here.
          if git diff --cached --quiet; then
            echo "::notice::the tree already carries $version; tagging the commit as it stands"
            landed=yes
          else
            git commit -m "Release $version [skip ci]"
            landed=no
          fi
          for attempt in 1 2 3 4 5; do
            if [ "$landed" = yes ]; then break; fi
            if git push origin HEAD:main; then landed=yes; break; fi
            echo "::warning::push $attempt was refused; replaying the release commit on top of main"
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
            fi
          done
          if [ "$landed" != yes ]; then
            echo "::error::$version is published, but its release commit could not be pushed. Push it and tag it v$version by hand: the next release is derived from that tag."
            exit 1
          fi
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"

      - name: Say what happened
        if: steps.published.outputs.published == 'yes'
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo "### Published \`@osqd/admin-panel-builder@$version\`"
            echo ""
            echo "<https://www.npmjs.com/package/@osqd/admin-panel-builder/v/$version>"
          } >> "$GITHUB_STEP_SUMMARY"
